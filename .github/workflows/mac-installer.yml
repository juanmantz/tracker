name: Build and install Mac app
on:
  push:
    branches: [main, mac-installer, app-icon, compact-context]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dreams-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supersede:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Retire superseded builds of this branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_BRANCH: ${{ github.ref_name }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          gh api --method GET "repos/$GH_REPO/actions/workflows/mac-installer.yml/runs?branch=$BUILD_BRANCH&per_page=20" --jq '.workflow_runs[] | select(.status != "completed") | .id' > /tmp/dreams-build-runs
          while IFS= read -r BUILD_RUN; do
            if (( BUILD_RUN < CURRENT_RUN )); then
              gh run cancel "$BUILD_RUN" --repo "$GH_REPO" || true
            fi
          done < /tmp/dreams-build-runs
  installer:
    needs: supersede
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify capture and whole-hour transfer contracts before building
        run: python3 -m unittest discover -s tests -v
      - name: Fetch verified bundled Python runtimes
        run: |
          curl -fL --retry 2 'https://github.com/astral-sh/python-build-standalone/releases/download/20261009/cpython-3.12.15%2B20261009-aarch64-apple-darwin-install_only_stripped.tar.gz' -o /tmp/dreamstime-arm64.tar.gz
          curl -fL --retry 2 'https://github.com/astral-sh/python-build-standalone/releases/download/20261009/cpython-3.12.15%2B20261009-x86_64-apple-darwin-install_only_stripped.tar.gz' -o /tmp/dreamstime-intel.tar.gz
          echo '233f8e15255b3e1d1fd47ea5dd5230dfed803f371138e896e54d98c60ae19f6f  /tmp/dreamstime-arm64.tar.gz' | shasum -a 256 -c -
          echo 'fb3187d95334813b88940db0f1ca57b84cedfd552739c3a5771c3ea0e49988c9  /tmp/dreamstime-intel.tar.gz' | shasum -a 256 -c -
      - name: Build native universal app and installer
        run: bash scripts/build-installer-mac.sh
      - name: Start the prior service with saved history before upgrading
        run: |
          defaults write local.dreamstime.companion screenCaptureRequested -bool true
          python3 tests/mac_upgrade_check.py prepare
      - name: Install using macOS Installer and open the real native window
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog={'revision':1,'nodes':[{'id':'fixture-'+str(i),'kind':'project','name':'Fixture project '+str(i),'fields':{}} for i in range(11)],'edges':[],'preferences':{'desktop_context_enabled':True}}
          Path('artifacts/native-release/fixture-projects.json').write_text(json.dumps(catalog))
          PY
          python3 scripts/personalize-installer.py artifacts/native-release/Dreams-Time-Installer.pkg artifacts/native-release/fixture-projects.json artifacts/native-release/Personalized-test.pkg
          sudo /usr/sbin/installer -pkg artifacts/native-release/Personalized-test.pkg -target /
          /usr/bin/codesign --verify --deep --strict '/Applications/Dreams Time.app'
          '/Applications/Dreams Time.app/Contents/MacOS/DreamsTime' --smoke-test > artifacts/native-release/app-smoke.log 2>&1
          /usr/bin/open -g '/Applications/Dreams Time.app'
          curl -f 'http://127.0.0.1:43123/health' > artifacts/native-release/health.json
          '/Applications/Dreams Time.app/Contents/Resources/project/native/activity-sensor' --once > artifacts/native-release/native-sample.json
          python3 - <<'PY'
          import json
          h=json.load(open('artifacts/native-release/health.json'))
          assert h['app']=='dreams-time' and h['version']=='0.11.0' and h['capture_host']=='app'
          s=json.load(open('artifacts/native-release/native-sample.json'))
          assert isinstance(s['app'],str) and s['idle']>=0 and isinstance(s['accessibility'],bool)
          import time, urllib.request
          from pathlib import Path
          token=(Path.home()/'Library/Application Support/Dreams Time/pairing-token').read_text().strip()
          for _ in range(20):
              request=urllib.request.Request('http://127.0.0.1:43123/api/diagnostics',headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(request) as response: diagnostics=json.load(response)
              if diagnostics['recording']['sample_count']>=2: break
              time.sleep(.5)
          assert diagnostics['recording']['sample_count']>=2, diagnostics
          assert diagnostics['recording']['process_running'], diagnostics
          assert diagnostics['health']['collector']['collector_bundle']=='local.dreamstime.companion', diagnostics
          assert 'window_access_status' in diagnostics['health']['collector'], diagnostics
          Path('artifacts/native-release/diagnostics.json').write_text(json.dumps(diagnostics))
          request=urllib.request.Request('http://127.0.0.1:43123/api/snapshot',headers={'Authorization':'Bearer '+token})
          with urllib.request.urlopen(request) as response: snapshot=json.load(response)
          assert len(snapshot['projects'])==11 and not snapshot['dreams']['connected']
          assert snapshot['desktop_context_enabled']
          Path('artifacts/native-release/bootstrap-check.json').write_text(json.dumps({'projects':len(snapshot['projects']),'tracking_samples':snapshot['recording']['sample_count'],'sign_in_required_for_tracking':False}))
          print('Installed native app, bundled runtime, HTTP service and native collector verified on macOS.')
          PY
      - name: Verify preserved hours and live sign-in setup from the installed app
        run: python3 tests/mac_upgrade_check.py verify
      - name: Prove Accessibility and document capture in the installed app process
        run: python3 tests/mac_ax_capture_check.py
      - name: Verify compact context, background call capture and a single app instance
        run: python3 tests/mac_context_capture_check.py
      - name: Prove real foreground screenshots, OCR and measured project time without Accessibility
        run: python3 tests/mac_screen_capture_check.py
      - name: Verify unattended recovery of the installed app
        run: python3 tests/mac_autonomy_check.py
      - name: Verify the real installed native app icon
        run: python3 tests/mac_app_icon_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: Dreams-Time-0.11.0-Update
          path: artifacts/native-release/Dreams-Time-Update.pkg
          compression-level: 0
      - name: Split download into manageable artifacts
        run: |
          split -b 24000000 artifacts/native-release/Dreams-Time-Installer.pkg artifacts/native-release/installer-part-
      - uses: actions/upload-artifact@v4
        with:
          name: installer-aa
          path: artifacts/native-release/installer-part-aa
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: installer-ab
          path: artifacts/native-release/installer-part-ab
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: installer-ac
          path: artifacts/native-release/installer-part-ac
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-install-proof
          path: |
            artifacts/native-release/app-smoke.log
            artifacts/native-release/health.json
            artifacts/native-release/native-sample.json
            artifacts/native-release/diagnostics.json
            artifacts/native-release/bootstrap-check.json
            artifacts/native-release/upgrade-check.json
            artifacts/native-release/live-setup-check.json
            artifacts/native-release/autonomy-check.json
            artifacts/native-release/ax-capture-check.json
            artifacts/native-release/context-check.json
            artifacts/native-release/screen-capture-check.json
            artifacts/native-release/icon-check.json
            artifacts/native-release/installed-icon.png
      - name: Publish direct installer downloads after successful Mac verification
        if: github.event_name == 'push' && (github.ref == 'refs/heads/mac-installer' || github.ref == 'refs/heads/app-icon' || github.ref == 'refs/heads/compact-context')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("artifacts/native-release/release-notes.txt").write_text("Dreams Time 0.11.0 adds actual foreground-window screenshots with on-device OCR on macOS 14+. Allow Screen Recording once in the app. No external AI key is needed. Images and full OCR text are immediately discarded; only compact project matches are retained. ChatGPT sidebar history and the bottom composer are excluded before OCR. A unique project match assigns only measured active time. Ambiguous context remains unassigned. Screenshot detection works independently of Accessibility permission.\n\nThe installer preserves project recognition, measured history and sign-in. Completed whole project hours publish automatically, with readback verification and no duplicate weekly records. No historical hours are invented. The app remains ad-hoc signed; macOS controls permission approval.\n")
          PY
          LATEST_BUILD="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq '.object.sha')"
          if [[ "$LATEST_BUILD" != "$GITHUB_SHA" ]]; then
            echo "A newer build superseded this run; no download published."
            exit 0
          fi
          if gh release view v0.11.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Version 0.11.0 is already released; keeping its installer immutable."
            exit 0
          fi
          gh release create v0.11.0 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dreams Time 0.11.0" --notes-file artifacts/native-release/release-notes.txt
          gh release upload v0.11.0 --repo "$GITHUB_REPOSITORY" artifacts/native-release/Dreams-Time-Update.pkg artifacts/native-release/Dreams-Time-Installer.pkg artifacts/app-icon/Dreams-Time-Icon.png artifacts/app-icon/Dreams-Time-Icon-128.png
