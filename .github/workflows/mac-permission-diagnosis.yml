name: Diagnose Mac upgrade permission identity
on:
  push:
    branches: [mac-permission-diagnosis]
permissions:
  contents: read
jobs:
  permission-identity:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the exact released installers
        run: |
          mkdir -p artifacts/native-release
          curl -fL --retry 2 https://github.com/juanmantz/tracker/releases/download/v0.8.0/Dreams-Time-Update.pkg -o artifacts/native-release/Previous-Update.pkg
          curl -fL --retry 2 https://github.com/juanmantz/tracker/releases/download/v0.8.1/Dreams-Time-Installer.pkg -o artifacts/native-release/Dreams-Time-Installer.pkg
          curl -fL --retry 2 https://github.com/juanmantz/tracker/releases/download/v0.8.1/Dreams-Time-Update.pkg -o artifacts/native-release/Dreams-Time-Update.pkg
      - name: Reproduce old enabled grant and verify fresh current grant
        run: python3 tests/mac_permission_identity_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permission-identity-proof
          path: artifacts/native-release/*-check.json
