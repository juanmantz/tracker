name: Build and verify Dreams Time icon
on:
  push:
    branches: [app-icon]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  app-icon:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native icon and compact icon-only installer
        run: bash scripts/build-app-icon.sh
      - name: Install the existing release and establish document capture
        run: |
          mkdir -p artifacts/native-release
          curl -fL --retry 2 https://github.com/juanmantz/tracker/releases/download/v0.8.1/Dreams-Time-Installer.pkg -o artifacts/native-release/Dreams-Time-Installer.pkg
          curl -fL --retry 2 https://github.com/juanmantz/tracker/releases/download/v0.8.1/Dreams-Time-Update.pkg -o artifacts/native-release/Dreams-Time-Update.pkg
          sudo /usr/sbin/installer -pkg artifacts/native-release/Dreams-Time-Installer.pkg -target /
          python3 tests/mac_ax_capture_check.py
      - name: Verify the icon preserves the running app and its Accessibility grant
        run: python3 tests/mac_app_icon_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dreams-time-icon-and-proof
          path: |
            artifacts/app-icon/Dreams-Time-Icon.pkg
            artifacts/app-icon/Dreams-Time-Icon.png
            artifacts/app-icon/before.png
            artifacts/app-icon/after.png
            artifacts/app-icon/icon-check.json
      - name: Save the native icon asset for future app bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/AppIcon.icns
          if ! git diff --cached --quiet; then
            git commit -m "Include generated native Dreams Time icon asset"
            git push origin HEAD:app-icon
          fi
      - name: Publish direct icon-only installer after verified permission preservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("artifacts/app-icon/release-notes.txt").write_text("Adds a distinctive Dreams Time app icon to the existing installation. Verified on macOS to preserve the app executable, signing identity, running collector, pairing and an already-working Accessibility grant. No app update or sign-in required. Also includes the native icon asset for future app bundles.\n")
          PY
          if ! gh release view v0.8.1-icon.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.8.1-icon.1 --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "Dreams Time app icon" --prerelease --notes-file artifacts/app-icon/release-notes.txt
          fi
          gh release upload v0.8.1-icon.1 --repo "$GITHUB_REPOSITORY" artifacts/app-icon/Dreams-Time-Icon.pkg artifacts/app-icon/Dreams-Time-Icon.png native/AppIcon.icns --clobber
