<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dreams Time companion</title><link rel="stylesheet" href="options.css"></head><body><main><p>Dreams / Time</p><h1>Connect this browser</h1><p>Start the local tracker, then copy its pairing token from Settings. Activity stays on your Mac.</p><form id="settings"><label>Pairing token<input id="token" type="password" autocomplete="off" required></label><label>Browser<select id="browser"><option value="chrome">Google Chrome</option><option value="edge">Microsoft Edge</option><option value="brave">Brave</option><option value="arc">Arc</option></select></label><label class="check"><input id="capture" type="checkbox">Include submitted ChatGPT messages for context</label><p class="muted">Optional. Saves up to 5 recent user messages from the active conversation locally. Drafts and other page contents are never read. Private browsing is excluded.</p><button>Save connection</button></form><p id="status" role="status"></p></main><script src="options.js"></script></body></html>
